<!-- agregar_rol.html -->

{% extends 'base.html' %}
{% block title %}Agregar Rol{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Rol</title>
    {% load static %}
    <!-- Font Awesome CDN para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Enlace al CSS específico -->
    <link rel="stylesheet" href="{% static 'css/agregar_rol.css' %}">
</head>
<body>
    <div class="container">
        <!-- Ícono de rol -->
        <i class="fas fa-user-tag icon"></i>
        
        <h2>Agregar Rol</h2>
        <p class="obligatorio-texto">Todos los campos con <span class="required">*</span> son obligatorios.</p>
        
        <!-- Mensajes de éxito y error generales -->
        <div id="error-message" class="alert alert-error" style="display: none;"></div>
        <div id="success-message" class="alert alert-success" style="display: none;"></div>
        
        <!-- Formulario para agregar rol -->
        <form id="rolForm" method="POST" action="{% url 'agregar_rol' %}">
            {% csrf_token %}
            
            <!-- Campo Nombre del Rol -->
            <div class="form-group">
                <label for="{{ form.nombre.id_for_label }}">
                    {{ form.nombre.label }} <span class="required">*</span>
                </label>
                {{ form.nombre }}
                <div class="field-error" id="error-id_nombre"></div>
            </div>
            
            <!-- Campo Descripción -->
            <div class="form-group">
                <label for="{{ form.descripcion.id_for_label }}">
                    {{ form.descripcion.label }}
                </label>
                {{ form.descripcion }}
                <div class="field-error" id="error-id_descripcion"></div>
            </div>
            
            <!-- Botón de Envío -->
            <div class="form-group">
                <button type="submit" class="btn-agregar-rol">Agregar Rol</button>
            </div>
        </form>
    </div>
    
    <!-- Incluir el archivo JavaScript específico para esta página -->
    <script src="{% static 'javascript/agregar_rol.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
{% endblock %}
