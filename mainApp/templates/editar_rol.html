{% extends 'base.html' %}
{% load static %}
{% block title %}Editar Rol{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Rol</title>
    <!-- Font Awesome CDN para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Enlace al CSS específico -->
    <link rel="stylesheet" href="{% static 'css/agregar_rol.css' %}">
</head>
<body>
    <div class="container">
        <i class="fas fa-user-tag icon"></i>  <!-- Ícono de rol -->
        <h2>Editar Rol</h2>
        <p class="obligatorio-texto">
            Todos los campos con <span class="required">*</span> son obligatorios.
        </p>

        <!-- Mensajes de error y éxito -->
        <div id="error-message" class="alert alert-error" style="display: none;"></div>
        <div id="success-message" class="alert alert-success" style="display: none;"></div>

        <!-- Form de edición -->
        <form id="rolForm" method="POST" action="{% url 'editar_rol' rol.rolid %}">
            {% csrf_token %}

            <!-- Campo Nombre -->
            <div class="form-group">
                <label for="{{ form.nombre.id_for_label }}">
                    {{ form.nombre.label }} <span class="required">*</span>
                </label>
                {{ form.nombre }}
                <div class="field-error" id="error-id_nombre"></div>
            </div>

            <!-- Campo Descripción -->
            <div class="form-group">
                <label for="{{ form.descripcion.id_for_label }}">
                    {{ form.descripcion.label }}
                </label>
                {{ form.descripcion }}
                <div class="field-error" id="error-id_descripcion"></div>
            </div>

            <!-- Botón para actualizar -->
            <div class="form-group">
                <button type="submit" class="btn-agregar-rol">Actualizar Rol</button>
            </div>
        </form>
    </div>

    <!-- Incluir el archivo JavaScript específico para esta página -->
    <script src="{% static 'javascript/editar_rol.js' %}"></script>
</body>
</html>
{% endblock %}
