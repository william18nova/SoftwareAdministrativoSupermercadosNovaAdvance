{# templates/modal_venta.html #}
<div id="myModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="mpago-title">
  <div class="modal-content">
    <span class="close" aria-label="Cerrar">&times;</span>
    <h2 id="mpago-title">Seleccione el medio de pago</h2>

    <label class="radio-wrap">
      <input type="radio" id="nequi" name="payment_method" value="nequi">
      <span>Nequi</span>
    </label>
    <label class="radio-wrap">
      <input type="radio" id="daviplata" name="payment_method" value="daviplata">
      <span>Daviplata</span>
    </label>
    <label class="radio-wrap">
      <input type="radio" id="efectivo" name="payment_method" value="efectivo">
      <span>Efectivo</span>
    </label>

    <div id="efectivo-options" style="display:none; margin-top:1em;">
      <label for="monto-recibido">Monto recibido</label>
      <input type="number" id="monto-recibido" min="0" step="100" placeholder="0">
      <p id="cambio" style="font-weight:bold; margin-top:0.5em;"></p>
    </div>

    <button id="confirmar-pago" class="btn btn-success" style="margin-top:1em;">
      Confirmar Pago
    </button>
  </div>
</div>
