<!-- editar_categoria.html -->
{% extends 'base.html' %}
{% load static %}
{% block title %}Editar Categoría{% endblock %}
{% block content %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Editar Categoría</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link rel="stylesheet" href="{% static 'css/agregar_categoria.css' %}"/>
</head>
<body>
  <div class="container">
    <i class="fas fa-pencil-alt icon"></i>
    <h2>Editar Categoría</h2>
    <p class="obligatorio-texto">
      Todos los campos con <span class="required">*</span> son obligatorios.
    </p>

    <div id="error-message" class="alert alert-error" style="display: none;"></div>
    <div id="success-message" class="alert alert-success" style="display: none;"></div>

    <form id="categoriaEditForm" action="{% url 'editar_categoria' form.instance.pk %}" method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="{{ form.nombre.id_for_label }}">
          {{ form.nombre.label }} <span class="required">*</span>
        </label>
        {{ form.nombre }}
        <div class="field-error" id="error-id_nombre"></div>
      </div>

      <div class="form-group">
        <label for="{{ form.descripcion.id_for_label }}">
          {{ form.descripcion.label }}
        </label>
        {{ form.descripcion }}
        <div class="field-error" id="error-id_descripcion"></div>
      </div>

      <div class="form-group">
        <input type="submit" value="Actualizar" class="btn-agregar-categoria">
      </div>
    </form>
  </div>

  <script src="{% static 'javascript/editar_categorias.js' %}"></script>
</body>
</html>
{% endblock %}
